name: Upload release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v2.0.0'
      asset:
        description: 'File name on the dist branch'
        required: true
        default: 'GeLiLauncher-2.0-win-x64.exe'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dist branch
        uses: actions/checkout@v4
        with:
          ref: dist

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          ls -lh "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Show release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
